{% extends "base.html" %}{% block content %}<div class="auth-wrap"><form method="post" class="form-panel auth-panel">{% csrf_token %}<span class="eyebrow">WELCOME BACK</span><h1>Log in.</h1>{% if form.errors %}<p class="field-error">Username or password is incorrect.</p>{% endif %}<label for="id_username">Username</label>{{ form.username }}<label for="id_password">Password</label>{{ form.password }}<button class="button full">Log in</button><p>New here? <a href="{% url 'signup' %}">Create an account</a></p></form></div>{% endblock %}
